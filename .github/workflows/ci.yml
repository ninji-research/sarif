name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-check-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-check-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-test-

      - run: cargo test --workspace --all-features --no-fail-fast

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: c-backend
            features: c-backend,codegen
          - name: wasm
            features: wasm,codegen
          - name: native
            features: native-build,codegen
          - name: all
            features: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-build-${{ matrix.profile.name }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-build-

      - name: Build (${{ matrix.profile.name }})
        run: |
          if [ "${{ matrix.profile.features }}" = "" ]; then
            cargo build --release -p sarifc --all-features
          else
            cargo build --release -p sarifc --no-default-features --features "${{ matrix.profile.features }}"
          fi
          mkdir -p release-artifacts
          cp target/release/sarifc release-artifacts/sarifc-${{ matrix.profile.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: sarifc-${{ matrix.profile.name }}
          path: release-artifacts/sarifc-${{ matrix.profile.name }}

  package:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sarifc-*
          path: release-artifacts
          merge-multiple: true

      - run: |
          tar -czf release.tar.gz -C release-artifacts .
          ls -la release-artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release.tar.gz

  native-test:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v6
    with:
      fetch-depth: 0
  - uses: actions-rust-lang/setup-rust-toolchain@v1
    with:
      toolchain: stable
      components: clippy
  - uses: actions/cache@v5
    with:
      path: |
        ~/.cargo/registry
        ~/.cargo/git
      key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
      restore-keys: |
        ${{ runner.os }}-cargo-registry-
  - uses: actions/cache@v5
    with:
      path: target
      key: ${{ runner.os }}-cargo-target-native-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
      restore-keys: |
        ${{ runner.os }}-cargo-target-native-test-
  - name: Build sarifc with native backend
    run: cargo build --release -p sarifc --no-default-features --features "native-build,codegen"
  - name: Native backend smoke tests (F64, lists, builtins)
    run: cargo test --package sarif_codegen -- jit_runs_f64_function --exact --nocapture
  - name: Native feature integration tests
    run: cargo test --workspace --features "native-build,codegen" --lib --no-fail-fast 2>&1 | tail -30

benchmark:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-bench-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-bench-

      - name: Build sarifc (release)
        run: cargo build --release -p sarifc

      - name: Clone bnch benchmark suite
        run: |
          git clone https://github.com/ninji-research/bnch bnch --depth 1 2>/dev/null || echo "bnch clone skipped (repo may not be accessible)"

      - name: Run bnch sarif lane
        if: success()
        run: |
          if [ -d bnch ]; then
            cd bnch && ./bnch run sarif 2>&1 | tee ../bnch-results.log || true
          else
            echo "bnch not cloned; benchmark regression check skipped"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: bnch-results.log
