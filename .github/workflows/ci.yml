name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-check-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-check-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-test-

      - run: cargo test --workspace --all-features --no-fail-fast

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: c-backend
            features: c-backend,codegen
          - name: wasm
            features: wasm,codegen
          - name: native
            features: native-build,codegen
          - name: all
            features: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-build-${{ matrix.profile.name }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-build-

      - name: Build (${{ matrix.profile.name }})
        run: |
          if [ "${{ matrix.profile.features }}" = "" ]; then
            cargo build --release -p sarifc --all-features
          else
            cargo build --release -p sarifc --no-default-features --features "${{ matrix.profile.features }}"
          fi
          mkdir -p release-artifacts
          cp target/release/sarifc release-artifacts/sarifc-${{ matrix.profile.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: sarifc-${{ matrix.profile.name }}
          path: release-artifacts/sarifc-${{ matrix.profile.name }}

  package:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sarifc-*
          path: release-artifacts
          merge-multiple: true

      - run: |
          tar -czf release.tar.gz -C release-artifacts .
          ls -la release-artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release.tar.gz
